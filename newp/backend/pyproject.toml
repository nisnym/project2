[project]
name = "pfa-backend"
version = "0.1.0"
description = "Personal Financial Advisor — FastAPI microservices (gateway + 5 domain services)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Chat transport. GitHub Models speaks the OpenAI wire protocol, so the
    # official OpenAI SDK is the "GitHub SDK" path — see services/chat_service.
    "openai>=1.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["shared*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
