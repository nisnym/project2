[project]
name = "platform-common"
version = "0.1.0"
description = "Shared library for the banking platform services: events, auth, HTTP, observability."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-q2>=1.10",
    "psycopg[binary]>=3.1",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "cachetools>=5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_common"]
